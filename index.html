<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Valley</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d0c; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      /* Boot loading screen (driven by src/ui/loading/loading.ts). Inline so it paints before any script loads. */
      #boot { position: fixed; inset: 0; z-index: 30; background: #0b0d0c; color: #eef0ea; display: flex; flex-direction: column;
        justify-content: center; padding: 0 clamp(24px, 7vw, 120px); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
        transition: opacity .45s ease; user-select: none; }
      #boot.bt-done { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0 0 clamp(28px, 6vh, 56px); font: 700 clamp(54px, 9vw, 112px)/.86 "Bahnschrift", "DIN Alternate", "DIN Condensed", "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
        letter-spacing: .01em; text-transform: uppercase; }
      #boot .bt-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; width: min(440px, 100%); margin-bottom: 10px;
        font-size: 14px; color: #a8b0a6; }
      #boot .bt-pct { font: 600 14px/1 "Bahnschrift", "DIN Alternate", "Arial Narrow", system-ui, sans-serif; letter-spacing: .08em; color: #eef0ea; font-variant-numeric: tabular-nums; }
      #boot .bt-track { width: min(440px, 100%); height: 4px; background: rgba(238, 240, 234, .12); overflow: hidden; }
      #boot .bt-fill { height: 100%; background: #d9a441; transform: scaleX(0); transform-origin: left; transition: transform .25s ease-out; }
      #boot.bt-failed .bt-status { color: #e8836b; }
      @media (prefers-reduced-motion: reduce) { #boot, #boot .bt-fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Loading Project Valley" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <!-- font-stretch inline: the CSS minifier folds it into the font shorthand as an invalid 75% -->
      <h1 style="font-stretch: condensed">Project<br />Valley</h1>
      <div class="bt-row"><span class="bt-status">Loading game code</span><span class="bt-pct">0%</span></div>
      <div class="bt-track"><div class="bt-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
