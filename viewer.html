<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Project Valley - character viewer</title><link rel="icon" href="data:," />
<style>
html,body{margin:0;height:100%;background:#12161a;color:#e6e9e4;font:13px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-columns:300px 1fr}
#side{overflow:auto;padding:12px 14px;background:#0c0f12;border-right:1px solid #2a3138}
#stage{position:relative}#stage canvas{display:block;width:100%;height:100%}
h1{font:700 15px "Bahnschrift",system-ui;letter-spacing:.18em;text-transform:uppercase;color:#d9a441;margin:0 0 10px}
h2{font:600 11px "Bahnschrift",system-ui;letter-spacing:.2em;text-transform:uppercase;color:#8d979c;margin:16px 0 6px}
button,select{background:#1a2026;color:#e6e9e4;border:1px solid #2f3942;border-radius:3px;padding:5px 8px;font:inherit;cursor:pointer}
button:hover{border-color:#d9a441}button.on{background:#d9a441;color:#14171a;border-color:#d9a441}
.grid{display:flex;flex-wrap:wrap;gap:5px}label{display:flex;align-items:center;gap:6px;margin:4px 0}
#hud{position:absolute;left:12px;top:10px;color:#9aa5a1;font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
</style></head><body><div id="app"><div id="side"></div><div id="stage"><div id="hud"></div></div></div>
<script type="module" src="/src/viewer/main.ts"></script></body></html>
