function fitCamera(obj, aspect) {
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
  cam.position.set(1.5, 1.35, 2.2); cam.lookAt(0, 0, 0);
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  const ctr = box.getCenter(new THREE.Vector3());
  cam.position.add(ctr); cam.lookAt(ctr); cam.updateMatrixWorld(true);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(cam.matrixWorldInverse);
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  let w = (x1 - x0) * 1.08, h = (y1 - y0) * 1.08;
  if (w / h < aspect) w = h * aspect; else h = w / aspect;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  cam.left = cx - w / 2; cam.right = cx + w / 2; cam.top = cy + h / 2; cam.bottom = cy - h / 2; cam.updateProjectionMatrix();
  return cam;
}

async function glbObject(id) {
  const m = PICKUP_MODELS.files[id];
  const g = await loader.loadAsync(`/assets/models/item/${m.file}.glb`);
  const o = g.scene;
  if (!m.upright) { // lie it the way the grid draws it: long axis up for tall boxes
    const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3());
    if (s.z > s.y && s.z >= s.x) o.rotation.x = -Math.PI / 2; // thin-lying models stand up
  }
  return o;
}

const PROC_ICON = new Set(['riot_helmet', 'first_aid_kit']);
window.renderIcon = async (id) => {
  const d = ITEMS[id];
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.35));
  const sun = new THREE.DirectionalLight(0xfff3e0, 2.4); sun.position.set(2, 3, 3); scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9fb4d0, 0.7); fill.position.set(-3, 1, 1); scene.add(fill);
  let obj, src = 'proc';
  if (PICKUP_MODELS.files[id] && !PROC_ICON.has(id)) { try { obj = await glbObject(id); src = 'glb'; } catch (e) { obj = null; } }
  if (!obj) {
    const [name, opt] = MAP[id] ?? KIND[d.kind];

  }
  scene.add(obj);
  const lw = d.w, lh = d.h, long = Math.max(lw, lh), S = 128, W = Math.round((S * lw) / long), H = Math.round((S * lh) / long);

};
